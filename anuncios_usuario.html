<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="css/styles.css" type="text/css">

<head >
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URequest</title>
</head>
<body class="body">
    <header class="banner">
        <img src="images/URequest_logo.png" alt="URequest" class="logo">
        <button class="btn_menu_desplegable" id="boton_menu_desplegable"></button>        
    </header>

    <aside class="menu_desplegable" id="menu_desplegable">

        <button class="btn_cierre_menu_desplegable" id="btn_cierre_menu_desplegable"></button>

        <button class="btn_crear_anuncio" id="btn_crear_anuncio">Crear Anuncio</button>

        <a class="btn_ver_anuncios_usuario" id="btn_ver_anuncios_usuario" href="index.html"> Página principal </a>

    </aside>
    
    <!-- esto es la ventana como tal lo de adentro es como si flotara-->

    <dialog class="ventana" id="ventana">
        <form class="campo_texto" method="dialog">
            <input type="text" placeholder="Titulo" required>

    <!---Con esto ponemos las opciones a elegir de producto, servicio y transporte con sus respectivas checkboxes-->

            <div class="opciones">
                <label><input type="radio" name="tipo"><span></span> Producto</label>
                <label><input type="radio" name="tipo"><span></span> Servicio</label>
                <label><input type="radio" name="tipo"><span></span> Transporte</label>
            </div>

    <!--Texto de telefono o correo-->

            <input type="text" placeholder="Telefono o correo" required>

            <!--se junta el area del texto con el contador de 0/500-->

            <div class="caja-desc">
                <textarea id="desc" maxlength="500" placeholder="Descripción corta"></textarea>
                <span id="contador">0/500</span>
            </div>

    <!--Son los botones de cerrar y publicar-->

            <div class="botones">
                <button type="button" class="btns_ventana_publicar" id="cerrar">Cerrar</button>
                <button type="submit" class="btns_ventana_publicar">Publicar</button>
            </div>
        </form>


    <script src="script/script.js"></script>

</body>
</html>
